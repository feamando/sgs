<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Satz - Radiance Labs</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <header>
    <div>
      <span class="brand">Radiance Labs</span>
      <span class="brand-sub">Satz demo v0.2</span>
    </div>
    <span class="meta" id="device-info">loading...</span>
  </header>

  <main>
    <div class="input-section">
      <div class="controls">
        <div class="control-group">
          <label for="model-select">model</label>
          <select id="model-select"></select>
        </div>
      </div>
      <label for="prompt">Prompt</label>
      <textarea id="prompt" placeholder="Type a prompt and press Generate..."></textarea>
      <div class="controls">
        <button id="generate-btn">Generate</button>
        <div class="control-group">
          <label for="temp-input">temp</label>
          <input type="number" id="temp-input" value="0.8" min="0.1" max="2.0" step="0.1">
        </div>
        <div class="control-group">
          <label for="max-tokens-input">max tokens</label>
          <input type="number" id="max-tokens-input" value="200" min="10" max="512" step="10">
        </div>
      </div>
    </div>

    <div class="output-section">
      <label>Generated Output</label>
      <div id="output">
        <span class="output-empty">Output will appear here after generation.</span>
      </div>
    </div>
  </main>

  <aside>
    <div class="sidebar-title">Retrieved Blobs</div>
    <div class="k-slider-section">
      <label>
        top-k blobs
        <span id="k-value">8</span>
      </label>
      <input type="range" id="k-slider" min="1" max="16" value="8">
    </div>
    <div id="blob-list">
      <span class="blob-empty">No blobs retrieved yet.</span>
    </div>
  </aside>

  <footer>
    <span id="status">Ready</span>
  </footer>

  <script src="/static/app.js"></script>
</body>
</html>
