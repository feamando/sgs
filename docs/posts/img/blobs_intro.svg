<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" font-family="Inter, -apple-system, sans-serif">
  <rect width="800" height="400" fill="#0a0a0f"/>

  <!-- Title -->
  <text x="400" y="35" text-anchor="middle" fill="#f5f1e8" font-size="16" font-weight="700">How Blobs Work: Chunked Meaning as a Primitive</text>

  <!-- Left: Passage to Blob (offline) -->
  <text x="200" y="70" text-anchor="middle" fill="#8a8598" font-size="11" font-weight="600">OFFLINE: BUILD</text>

  <!-- Passage box -->
  <rect x="50" y="85" width="300" height="50" rx="6" fill="#12121a" stroke="#1f1f2a"/>
  <text x="200" y="107" text-anchor="middle" fill="#f5f1e8" font-size="11">"The capital of France is Paris.</text>
  <text x="200" y="123" text-anchor="middle" fill="#f5f1e8" font-size="11">Paris is known for the Eiffel Tower..."</text>

  <!-- Arrow down -->
  <path d="M200 135 L200 155" stroke="#ffb347" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="260" y="150" fill="#8a8598" font-size="10">encode</text>

  <!-- Blob circle -->
  <circle cx="200" cy="190" r="30" fill="none" stroke="#ffb347" stroke-width="2" stroke-dasharray="4,2"/>
  <circle cx="200" cy="190" r="5" fill="#ffb347"/>
  <text x="200" y="195" text-anchor="middle" fill="#ffb347" font-size="9" font-weight="600">blob</text>
  <text x="200" y="235" text-anchor="middle" fill="#8a8598" font-size="9">mu (d_s=128) + features (d_f=1000)</text>

  <!-- Store -->
  <path d="M200 220 L200 255" stroke="#ffb347" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="120" y="260" width="160" height="35" rx="6" fill="#1a1a2e" stroke="#ffb347" stroke-width="1"/>
  <text x="200" y="282" text-anchor="middle" fill="#ffb347" font-size="11" font-weight="600">Blob Store</text>

  <!-- Right: Query + Retrieve (online) -->
  <text x="580" y="70" text-anchor="middle" fill="#8a8598" font-size="11" font-weight="600">ONLINE: RETRIEVE + RENDER</text>

  <!-- Query box -->
  <rect x="430" y="85" width="300" height="35" rx="6" fill="#12121a" stroke="#1f1f2a"/>
  <text x="580" y="107" text-anchor="middle" fill="#f5f1e8" font-size="11">"What is the capital of France?"</text>

  <!-- Arrow down -->
  <path d="M580 120 L580 145" stroke="#6bcfff" stroke-width="2" marker-end="url(#arrowBlue)"/>
  <text x="640" y="138" fill="#8a8598" font-size="10">encode query</text>

  <!-- Query vector -->
  <circle cx="580" cy="165" r="8" fill="#6bcfff"/>
  <text x="580" y="169" text-anchor="middle" fill="#0a0a0f" font-size="8" font-weight="700">q</text>

  <!-- Cosine match arrow to blob store -->
  <path d="M280 277 L430 200" stroke="#8a8598" stroke-width="1" stroke-dasharray="3,3"/>
  <path d="M572 173 L520 200" stroke="#6bcfff" stroke-width="2" marker-end="url(#arrowBlue)"/>

  <!-- Retrieved blob -->
  <rect x="460" y="200" width="120" height="30" rx="6" fill="#1a1a2e" stroke="#ffb347"/>
  <text x="520" y="219" text-anchor="middle" fill="#ffb347" font-size="10">top-k blobs</text>

  <!-- Arrow to rendering -->
  <path d="M580 230 L580 265" stroke="#ffb347" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Two-pass rendering -->
  <rect x="430" y="270" width="300" height="55" rx="6" fill="#12121a" stroke="#1f1f2a"/>
  <text x="580" y="290" text-anchor="middle" fill="#ffb347" font-size="10" font-weight="600">Pass 1: Render blobs (alpha-compositing)</text>
  <text x="580" y="310" text-anchor="middle" fill="#6bcfff" font-size="10" font-weight="600">Pass 2: Render words (remaining capacity)</text>

  <!-- Output -->
  <path d="M580 325 L580 350" stroke="#f5f1e8" stroke-width="2" marker-end="url(#arrowWhite)"/>
  <rect x="480" y="355" width="200" height="30" rx="6" fill="#1a2e1a" stroke="#4ade80"/>
  <text x="580" y="374" text-anchor="middle" fill="#4ade80" font-size="11" font-weight="600">Output: "Paris"</text>

  <!-- Arrow markers -->
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6" fill="none" stroke="#ffb347" stroke-width="1.5"/>
    </marker>
    <marker id="arrowBlue" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6" fill="none" stroke="#6bcfff" stroke-width="1.5"/>
    </marker>
    <marker id="arrowWhite" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6" fill="none" stroke="#f5f1e8" stroke-width="1.5"/>
    </marker>
  </defs>
</svg>
